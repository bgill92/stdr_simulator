[project]
name = "stdr_simulator"
description = "A simple, flexible and scalable 2D multi-robot simulator — ROS2 Jazzy port"
version = "1.0.0"
channels = [
  "https://conda.anaconda.org/robostack-jazzy",
  "conda-forge",
]
platforms = ["linux-64"]

[dependencies]
ros-jazzy-rclcpp = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-tf2 = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-tf2-geometry-msgs = "*"
ros-jazzy-rclcpp-action = "*"
ros-jazzy-rclcpp-components = "*"
ros-jazzy-rosidl-default-generators = "*"
ros-jazzy-rosidl-default-runtime = "*"
ros-jazzy-ament-cmake = "*"
ros-jazzy-ament-cmake-auto = "*"
ros-jazzy-ros2launch = "*"
ros-jazzy-visualization-msgs = "*"
yaml-cpp = "*"
ros-jazzy-tl-expected = "*"
libpng = "*"
zlib = "*"
glfw = "*"
libgl-devel = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
compilers = "*"
colcon-common-extensions = "*"
ros-jazzy-ament-lint-auto = "*"
ros-jazzy-ament-cmake-gtest = "*"
clang-tools = "*"
pre-commit = "*"
imgui = ">=1.92.3,<2"
implot = ">=0.17,<0.18"

[activation.env]
STDR_RESOURCES_DIR = "$PIXI_PROJECT_ROOT/stdr_resources/resources"

[tasks]
build = "colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
test = { cmd = "colcon test --event-handlers console_direct+", depends-on = ["build"] }
clean = "rm -rf build install log"
lint = "pre-commit run -a"
standalone = { cmd = "install/stdr_standalone/lib/stdr_standalone/stdr_standalone_exe", depends-on = ["build"] }
standalone-cmake = "scripts/build_standalone.sh"
clean-standalone = "rm -rf build_standalone"
